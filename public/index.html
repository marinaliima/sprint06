<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mensageiro Local</title>
  <link rel="stylesheet" href="./style.css">
  <script src="./app.js" defer></script>
</head>

<body>
  <main>
    <h1>Mensageiro da turma</h1>
    <ul id="lista"></ul>
    <form id="formulario">
      <input id="usuario" maxlength="40" placeholder="Seu nome" required>
      <input id="texto" maxlength="500" placeholder="Mensagem" required>
      <button>Enviar</button>
    </form>
    <p id="aviso" role="status"></p>
  </main>
</body>

</html>
